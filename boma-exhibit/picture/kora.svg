<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"
     width="400" height="400" role="img" aria-label="KORA, a robot">
  <title>KORA, a robot</title>
  <defs>
    <pattern id="kora-cloth" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="#7e2817"/>
      <path d="M32 6 L58 32 L32 58 L6 32 Z" fill="none" stroke="#c8452b"
            stroke-width="3" opacity="0.38"/>
      <path d="M32 20 L44 32 L32 44 L20 32 Z" fill="#c8452b" opacity="0.22"/>
      <rect x="0" y="30" width="10" height="4" fill="#c8452b" opacity="0.32"/>
      <rect x="54" y="30" width="10" height="4" fill="#c8452b" opacity="0.32"/>
    </pattern>
    <linearGradient id="kora-shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fbdcd3"/>
    </linearGradient>
    <radialGradient id="kora-vignette" cx="50%" cy="40%" r="65%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3"/>
    </radialGradient>
  </defs>

  <!-- Textile ground -->
  <rect width="400" height="400" fill="url(#kora-cloth)"/>
  <rect width="400" height="400" fill="url(#kora-vignette)"/>

  <!-- Antennas. Drawn before the head so their bases tuck behind it, and
       stroked twice (dark under light) so they read against any pattern. -->
  <g fill="none" stroke-linecap="round">
    <g stroke="#7e2817" stroke-width="17">
      <path d="M152 150 L152.0 72.0"/>
      <path d="M248 150 L248.0 72.0"/>
    </g>
    <g stroke="#fbdcd3" stroke-width="8">
      <path d="M152 150 L152.0 72.0"/>
      <path d="M248 150 L248.0 72.0"/>
    </g>
  </g>
  <circle cx="152.0" cy="72.0" r="17" fill="#c8452b" stroke="#7e2817" stroke-width="6"/>
  <circle cx="248.0" cy="72.0" r="17" fill="#c8452b" stroke="#7e2817" stroke-width="6"/>

  <!-- Shoulders -->
  <path d="M70 400 v-36 a56 56 0 0 1 56 -56 h148 a56 56 0 0 1 56 56 v36 z"
        fill="#c8452b" stroke="#7e2817" stroke-width="7"/>

  <!-- Head -->
  <rect x="98" y="118" width="204" height="196" rx="76"
        fill="url(#kora-shell)" stroke="#7e2817" stroke-width="8"/>

  <!-- Visor -->
  <rect x="132" y="186" width="136" height="66" rx="33" fill="#241a13"/>
  <rect x="132" y="186" width="136" height="28" rx="14" fill="#ffffff" opacity="0.09"/>
  <circle cx="173" cy="219" r="15" fill="#c8452b"/><circle cx="227" cy="219" r="15" fill="#c8452b"/><circle cx="177" cy="214" r="5.5" fill="#ffffff" opacity="0.9"/><circle cx="231" cy="214" r="5.5" fill="#ffffff" opacity="0.9"/>

  <!-- Speaker grille -->
  <g fill="#7e2817" opacity="0.5">
    <rect x="170" y="272" width="60" height="8" rx="4"/>
    <rect x="180" y="288" width="40" height="8" rx="4"/>
  </g>
</svg>
