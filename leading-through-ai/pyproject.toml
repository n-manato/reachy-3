[project]
name = "lta-exhibit"
version = "0.1.0"
description = "Leading Through AI: three Reachy Mini robots debate AI leadership dilemmas; visitors vote on touch screens"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "reachy-mini==1.9.0",
    "reachy-mini-dances-library",
    "httpx>=0.27",
    "requests",
    "psutil",
    "numpy",
    "scipy",
    "python-dotenv",
    # Script drafting only (menu 1). Never called while the show runs.
    "openai>=1.60",
    "pycairo ; sys_platform == 'linux'",
    "pygobject ; sys_platform == 'linux'",
    "fastapi",
    "uvicorn[standard]",
    "websockets",
    "lameenc>=1.8",
]

[project.scripts]
lta-exhibit = "lta_exhibit.main:main"
lta-gateway = "lta_exhibit.gateway:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lta_exhibit"]

[tool.uv]
environments = ["sys_platform == 'linux'", "sys_platform == 'win32'"]
override-dependencies = [
    "gstreamer-bundle ; sys_platform == 'win32'",
    "gstreamer-libs ; sys_platform == 'win32'",
    "gstreamer-msvc-runtime ; sys_platform == 'win32'",
]
