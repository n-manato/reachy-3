<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"
     width="400" height="400" role="img" aria-label="ZURI, a robot">
  <title>ZURI, a robot</title>
  <defs>
    <pattern id="zuri-cloth" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="#96660f"/>
      <path d="M32 6 L58 32 L32 58 L6 32 Z" fill="none" stroke="#e2a32d"
            stroke-width="3" opacity="0.38"/>
      <path d="M32 20 L44 32 L32 44 L20 32 Z" fill="#e2a32d" opacity="0.22"/>
      <rect x="0" y="30" width="10" height="4" fill="#e2a32d" opacity="0.32"/>
      <rect x="54" y="30" width="10" height="4" fill="#e2a32d" opacity="0.32"/>
    </pattern>
    <linearGradient id="zuri-shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fbf0d8"/>
    </linearGradient>
    <radialGradient id="zuri-vignette" cx="50%" cy="40%" r="65%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3"/>
    </radialGradient>
  </defs>

  <!-- Textile ground -->
  <rect width="400" height="400" fill="url(#zuri-cloth)"/>
  <rect width="400" height="400" fill="url(#zuri-vignette)"/>

  <!-- Antennas. Drawn before the head so their bases tuck behind it, and
       stroked twice (dark under light) so they read against any pattern. -->
  <g fill="none" stroke-linecap="round">
    <g stroke="#96660f" stroke-width="17">
      <path d="M152 150 L120.3 78.7"/>
      <path d="M248 150 L279.7 78.7"/>
    </g>
    <g stroke="#fbf0d8" stroke-width="8">
      <path d="M152 150 L120.3 78.7"/>
      <path d="M248 150 L279.7 78.7"/>
    </g>
  </g>
  <circle cx="120.3" cy="78.7" r="17" fill="#e2a32d" stroke="#96660f" stroke-width="6"/>
  <circle cx="279.7" cy="78.7" r="17" fill="#e2a32d" stroke="#96660f" stroke-width="6"/>

  <!-- Shoulders -->
  <path d="M70 400 v-36 a56 56 0 0 1 56 -56 h148 a56 56 0 0 1 56 56 v36 z"
        fill="#e2a32d" stroke="#96660f" stroke-width="7"/>

  <!-- Head -->
  <rect x="98" y="118" width="204" height="196" rx="76"
        fill="url(#zuri-shell)" stroke="#96660f" stroke-width="8"/>

  <!-- Visor -->
  <rect x="132" y="186" width="136" height="66" rx="33" fill="#241a13"/>
  <rect x="132" y="186" width="136" height="28" rx="14" fill="#ffffff" opacity="0.09"/>
  <path d="M158 224 q15 -20 30 0" fill="none" stroke="#e2a32d" stroke-width="9" stroke-linecap="round"/><path d="M212 224 q15 -20 30 0" fill="none" stroke="#e2a32d" stroke-width="9" stroke-linecap="round"/>

  <!-- Speaker grille -->
  <g fill="#96660f" opacity="0.5">
    <rect x="170" y="272" width="60" height="8" rx="4"/>
    <rect x="180" y="288" width="40" height="8" rx="4"/>
  </g>
</svg>
