[project]
name = "ethics-podcast"
version = "0.1.0"
description = "Ethics Podcast: Two Reachy Mini robots have an autonomous conversation about ethics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "reachy-mini==1.8.4",
    "reachy-mini-dances-library",
    "openai>=2.28.0",
    "httpx>=0.27",
    "numpy",
    "scipy",
    "python-dotenv",
    # pycairo / pygobject are only needed on Linux. On Windows & macOS,
    # reachy-mini pulls a self-contained `gstreamer-bundle` wheel instead, and
    # building pygobject from source on Windows fails (no girepository/GTK dev).
    # Scoping these to Linux is what lets `uv sync` succeed on Windows.
    "pycairo ; sys_platform == 'linux'",
    "pygobject ; sys_platform == 'linux'",
    # UI for the multi-display exhibit + legacy video window.
    "PySide6",
    "python-vlc",
    "pygame",
    # Browser-based exhibit UI (DISPLAY_BACKEND=web): serves display pages over
    # the LAN and pushes state to browsers over WebSocket.
    "fastapi",
    "uvicorn[standard]",
    "websockets",
    "requests",
    "openai",
    "SpeechRecognition>=3.10",
    "sounddevice>=0.5.5",
    # MP3 encoder (pure wheel, no system ffmpeg) used by the web display to
    # serve compressed speech audio to browsers instead of multi-MB WAVs.
    "lameenc>=1.8",
]

[project.scripts]
ethics-podcast = "ethics_podcast.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ethics_podcast"]

[tool.uv]
# Lock resolution is pinned to the platform where this lock was generated.
# To run on a different OS, edit this list (or delete `uv.lock`) and run
# `uv lock` on the target machine. See README for cross-platform setup.
environments = ["sys_platform == 'win32'"]

# reachy-mini bundles gstreamer-msvc-runtime for Windows but it has no
# wheels for macOS/Linux. Override to scope it to Windows only — macOS
# users install GStreamer via Homebrew, Linux users via apt/dnf.
override-dependencies = [
    "gstreamer-bundle ; sys_platform == 'win32'",
    "gstreamer-libs ; sys_platform == 'win32'",
    "gstreamer-msvc-runtime ; sys_platform == 'win32'",
]
